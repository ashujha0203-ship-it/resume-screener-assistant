spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:resume_screener}
    username: ${POSTGRES_USER:resume_screener}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
  read-timeout: ${OPENAI_READ_TIMEOUT:30s}
