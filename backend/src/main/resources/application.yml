server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:resume_screener}?sslmode=${POSTGRES_SSL_MODE:prefer}
    username: ${POSTGRES_USER:resume_screener}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5000}
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
  connect-timeout: ${GEMINI_CONNECT_TIMEOUT:5s}
  read-timeout: ${GEMINI_READ_TIMEOUT:30s}
